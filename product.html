        /* AYELUXE BRANDING HEADER */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid #f0f0f0; background: #fff; }

        /* MAIN AREA */
        .product-main { max-width: 1200px; margin: 40px auto; padding: 0 20px; display: flex; gap: 50px; flex-wrap: wrap; }
        .product-images { flex: 1.2; min-width: 350px; display: flex; gap: 15px; }
        .side-thumb { width: 90px; height: 90px; background: #f9f9f9; border-radius: 4px; overflow: hidden; border: 1px solid #eee; }
        .side-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .main-stage { flex: 1; height: 500px; background: #f9f9f9; border-radius: 8px; overflow: hidden; border: 1px solid #eee; }
        .main-stage img { width: 100%; height: 100%; object-fit: cover; }
        
        /* DETAILS SIDE */
        .product-info-box { flex: 1; min-width: 350px; display: flex; flex-direction: column; gap: 20px; }
        .brand-tag { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #888; }
        .product-title { font-size: 28px; font-weight: 500; color: #121212; line-height: 1.3; }
        .price-row { display: flex; align-items: center; gap: 15px; }
        .product-price { font-size: 24px; font-weight: 600; color: #121212; }
        .old-price { font-size: 18px; color: #999; text-decoration: line-through; }
        .sale-badge { background: #ff4665; color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: 600; }
        
        /* OFFERS */
        .offers-container { display: flex; gap: 15px; margin: 10px 0; }
        .offer-box { border: 1px dashed #ccc; padding: 12px; border-radius: 6px; flex: 1; background: #fffcfd; font-size: 13px; }
        .offer-box strong { color: #ff4665; display: block; margin-bottom: 4px; }
        
        /* BUTTONS */
        .btn-holder { margin-top: 15px; display: flex; flex-direction: column; gap: 12px; }
        .btn { padding: 15px; font-size: 15px; font-weight: 600; border: none; border-radius: 4px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; width: 100%; text-align: center; }
        .btn-dark { background: #181818; color: #fff; }
        .btn-light { background: #fff; color: #121212; border: 1px solid #121212; }
        
        /* DYNAMIC SUGGESTIONS SECTION */
        .suggestions-section { max-width: 1200px; margin: 80px auto 40px auto; padding: 0 20px; border-top: 1px solid #eee; padding-top: 40px; }
        .suggestions-header { font-size: 22px; font-weight: 500; margin-bottom: 30px; color: #121212; }
        .suggestions-grid { display: flex; gap: 20px; flex-wrap: wrap; }
        
        /* COPIED FROM YOUR BRACELET.HTML FOR 100% STYLE MATCH */
        .suggest-card { width: calc(25% - 15px); min-width: 220px; cursor: pointer; display: flex; flex-direction: column; }
        .suggest-img-box { width: 100%; height: 290px; background: #f9f9f9; border-radius: 8px; overflow: hidden; position: relative; }

            let related = allProducts.filter(p => p.category === product.category && p.id !== product.id);

            // Shuffling suggestions to make it look unique each time
            related.sort(() => 0.5 - Math.random());

            const grid = document.getElementById('suggestionsGrid');
            // Show top 4 items in grid
            related.slice(0, 4).forEach(item => {
                grid.innerHTML += `
                    <div class="suggest-card" onclick="window.location.href='product.html?id=${item.id}'">

        function addToCart(name, price, image) {

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.push({
        name: name,
        price: price,
        image: image
    });

    localStorage.setItem("cart", JSON.stringify(cart));

    alert("Added To Cart");
}

function buyNowDirect(name, price, image) {

    localStorage.setItem("buyNowItem", JSON.stringify({
        name: name,
        price: price,
        image: image
    }));

    window.location.href = "checkout.html";
}
