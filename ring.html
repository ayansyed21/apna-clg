<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;

}




body{
    margin:0;
      font-family: 'Poppins',sans-serif;
    background:#f7f7f7;
}




/* PRODUCTS */

.products{
    padding:30px 20px;
}

/* GRID */

.product-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:22px;
}

/* CARD */

.card{
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

/* IMAGE */

.img-box{
    position:relative;
    overflow:hidden;
}

.img-box img{
    width:100%;
    height:420px;
    object-fit:cover;
    display:block;
    transition:0.4s;
}

.hover-img{
    position:absolute;
    top:0;
    left:0;
    opacity:0;
}

.card:hover .hover-img{
    opacity:1;
}

.card:hover .main-img{
    opacity:0;
}

/* SALE */

.sale-tag{
    position:absolute;
    top:10px;
    right:10px;
    background:#ef5f6f;
    color:white;
    padding:6px 12px;
    font-size:12px;
    font-weight:600;
    border-radius:4px;
}

/* TITLE */

.card h3{
    font-size:14px;
    padding:14px 14px 5px;
    color:#333;
    line-height:1.4;
}

/* PRICE */

.price{
    padding:0 14px 14px;
}

.old-price{
    color:#d98a94;
    text-decoration:line-through;
    margin-right:8px;
    font-size:16px;
}

.new-price{
    font-size:18px;
    font-weight:700;
}

/* BUTTONS */

.card-buttons{
    display:flex;
    gap:8px;
    padding:0 14px 18px;
}

.cart-btn,
.buy-btn{
    flex:1;
    height:42px;
    border:none;
    border-radius:25px;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    transition:0.3s;
}

.cart-btn{
    background:#ef9fb0;
    color:white;
}

.cart-btn:hover{
    background:#e88bb0;
}

.buy-btn{
    background:black;
    color:white;
}

.buy-btn:hover{
    background:#e78ea1;
}

/* MOBILE */

@media(max-width:768px){

.product-grid{
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.img-box img{
    height:240px;
}

.card h3{
    font-size:15px;
    font-weight: 400;
    line-height: 1.4;
    color: #333;
    margin: 12px 14px 18px;
    min-height: 48px;
    letter-spacing: 0.2px;
}

.card{
    background:#fff;
    border-radius: 12px;
    overflow: hidden;
}

.old-price{
    font-size: 18px;
    font-weight: 700;
    color: #111;
}
.new-price{
    font-size:16px;
    font-weight: 500;
    color: #111;
}


.card-buttons{
    flex-direction:column;
}

.cart-btn,
.buy-btn{
font-weight: 500;
    font-size:14px;
}

}

</style>


</head>
